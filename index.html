  <style>
    /* Container "Stealth" */
        .hud-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            
            /* Fundo preto puro com leve transparência */
            background-color: rgba(0, 0, 0, 0.85);
            
            /* Borda fina cinza para definição */
            border: 1px solid #333;
            border-radius: 4px;
            
            padding: 15px;
            width: 200px;
            
            font-family: 'Courier New', Courier, monospace; /* Fonte técnica */
            color: #ccc; /* Cinza claro para o texto não cansar a vista */
            font-size: 13px;
            
            z-index: 1000;
            user-select: none;
            pointer-events: none;
        }

        /* Título */
        .hud-header {
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #fff;
            text-align: center;
        }

        /* Lista */
        .hud-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Estilo da Tecla - High Contrast */
        kbd {
            background-color: #1a1a1a; /* Cinza muito escuro */
            border: 1px solid #666;    /* Borda cinza média */
            border-radius: 3px;
            
            color: #fff; /* Letra branca pura */
            font-family: inherit;
            font-weight: bold;
            font-size: 12px;
            
            padding: 2px 8px;
            min-width: 20px;
            text-align: center;
            
            /* Sombra sólida (sem blur) para visual "flat" */
            box-shadow: 2px 2px 0px #000; 
        }

        /* Ajuste para barra de espaço */
        kbd.wide {
            min-width: 60px;
        }

        /* Efeito visual quando o jogador pressiona (opcional, via JS depois) */
        kbd:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }
  </style>
